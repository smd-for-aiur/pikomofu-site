:root{--bg:#EEF5FA;--paper:#fff;--ink:#3A2F45;--mute:#6F6480;--line:#D4DCE5;--pink:#C93A5A}
@media (prefers-color-scheme:dark){:root{--bg:#1C2029;--paper:#262B36;--ink:#F0ECF4;--mute:#ABA4B6;--line:#3A4150;--pink:#FF8FB0}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 -apple-system,BlinkMacSystemFont,system-ui,"Hiragino Sans","Apple SD Gothic Neo",sans-serif;min-height:100vh;min-height:100svh;overflow-x:hidden}
main{max-width:560px;width:100%;margin:0 auto;padding:18px 16px 28px}
nav{font-size:16px;line-height:1.5;margin-bottom:6px}
.brand{color:var(--ink);text-decoration:none}
a{color:var(--pink)}
.card{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:16px 18px;margin:12px 0}
/* the pixel font: DotGothic16 (16-px grid) for Japanese and the Latin languages, Fusion Pixel 12 (12-px grid) for Korean,
   Chinese and Russian, at sizes that land on whole device pixels; a name's other letters fall to the next family */
.px{font-weight:400;font-family:"Piko Dot","Piko KO",-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
html[lang=ko] .px{font-family:"Piko KO","Piko Dot",-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
html[lang=zh-Hant] .px{font-family:"Piko ZhHant","Piko Dot","Piko KO",-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
html[lang=zh-Hans] .px{font-family:"Piko ZhHans","Piko Dot","Piko KO",-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
html[lang=ru] .px{font-family:"Piko RU","Piko Dot","Piko KO",-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
/* the garden: whole device pixels per dot (visit.js sizes it), the app's 16pt corner */
.visit{padding:8px 8px 16px}
.garden{display:flex;justify-content:center;margin:0 0 14px}
.garden canvas{display:block;border-radius:16px;box-shadow:0 0 0 2px var(--line);image-rendering:pixelated;image-rendering:crisp-edges;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}
.garden canvas:focus-visible{outline:3px solid var(--pink);outline-offset:4px}
.no-pet .garden canvas{cursor:default}
h1{font-size:24px;line-height:1.4;margin:0 10px;text-align:center;text-wrap:balance}
@media (min-resolution:2.5dppx){.dot h1{font-size:21.3333px}}
/* the app's words are spaced into phrases: break lines only there (and anywhere, as a last resort, in a long name) */
h1,h2,p{word-break:keep-all;overflow-wrap:anywhere}
.visit p,.cta p,.note{text-wrap:balance}
#meta{text-align:center;margin:6px 0 0}
.hint{text-align:center;font-size:13px;color:var(--mute);margin:4px 0 0;min-height:1.5em}
#why{margin:10px 10px 0;text-align:center}
#why:empty{display:none}
.mute{color:var(--mute);font-size:14px}
/* with the app: a key like the app's, white with a 2px line and a 3px ledge that sinks when pressed */
.open{margin:16px 6px 0;padding-top:14px;border-top:2px dashed var(--line);text-align:center}
.open p{margin:0 0 10px;line-height:1.6}
.btn{display:inline-block;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:16px;box-shadow:0 3px 0 var(--ink);
     padding:10px 22px;text-decoration:none;font-size:16px;line-height:1.5;margin:0 0 3px;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn:focus-visible,.get:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.fp .btn,.fp #cta{font-size:18px}
@media (min-resolution:2.5dppx){.fp .btn,.fp #cta{font-size:20px}}
.cta{text-align:center}
.logo img{width:min(220px,60vw);height:auto;display:block;margin:6px auto 2px}
#lead{margin:8px 0 14px}
#cta{font-size:16px;line-height:1.5;margin:0 0 10px}
/* Apple's badge, unaltered: black on light, white on dark, 54px tall with clear space around it */
.get{display:inline-block;line-height:0;border-radius:10px}.get img{height:54px;width:auto}
#free{margin:12px 0 0}
#android{margin:4px 0 0}
.note{font-size:13px;line-height:1.6;margin:14px 4px 0;text-align:center}
footer{margin-top:18px;font-size:13px;color:var(--mute);text-align:center}
footer a{color:var(--mute)}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
